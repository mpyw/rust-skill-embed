[workspace]
resolver = "3"
members = ["skill-embed", "skill-embed-clap", "examples/demo-lint", "examples/demo-clap", "doctests"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mpyw/rust-skill-embed"
authors = ["mpyw"]

[workspace.dependencies]
skill-embed = { version = "0.1.0", path = "skill-embed", default-features = false }
skill-embed-clap = { version = "0.1.0", path = "skill-embed-clap" }
include_dir = "0.7"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
tempfile = "3"
thiserror = "2"
clap = "4"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `InstallOptions` in `install` says more at a call site than `Options` would,
# and the module is private either way.
module_name_repetitions = "allow"
