name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the checks
        run: ./test_all.sh

      # The adapter depends on the core, so the core has to be on crates.io
      # before the adapter can resolve it. The examples and the doctest crate
      # carry publish = false and are skipped.
      - name: Publish
        run: |
          cargo publish -p skill-embed
          cargo publish -p skill-embed-clap
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
